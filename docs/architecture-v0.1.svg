<!-- worker -> raw data -->
<line x1="620" y1="670" x2="520" y2="650" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
<!-- app -> payment -->
<line x1="580" y1="530" x2="300" y2="600" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#ar)"/>
<!-- app -> telegram out -->

