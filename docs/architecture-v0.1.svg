<!-- web/dashboard -> app api -->
<line x1="250" y1="490" x2="580" y2="490" stroke="#34d399" stroke-width="1.5" marker-end="url(#arg)"/>
<!-- app -> agent -->
<line x1="820" y1="480" x2="1000" y2="480" stroke="#34d399" stroke-width="1.5" marker-end="url(#arg)"/>
