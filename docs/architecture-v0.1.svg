  <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
  <marker id="arg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#34d399"/></marker>
  <marker id="arv" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a78bfa"/></marker>
  <marker id="aro" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#fb923c"/></marker>
</defs>
<rect width="1400" height="960" fill="#020617"/>
<rect width="1400" height="960" fill="url(#grid)"/>

<text x="40" y="44" fill="#e2e8f0" font-size="20" font-weight="bold">Hukuk-YZ · Mimari v0.1</text>
<text x="40" y="66" fill="#64748b" font-size="11">6 servis · Python/TS · Postgres · hedef Kubernetes · 2026-10-01</text>

