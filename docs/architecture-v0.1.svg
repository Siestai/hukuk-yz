<line x1="640" y1="540" x2="420" y2="700" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arv)"/>
<line x1="620" y1="690" x2="520" y2="710" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arv)"/>
<path d="M 1020 540 C 900 600, 700 640, 520 730" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arv)"/>
