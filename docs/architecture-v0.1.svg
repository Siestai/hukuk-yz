<!-- agent -> LLM gateway (external) -->
<line x1="1200" y1="490" x2="1290" y2="490" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
<!-- app -> worker (queue) -->
<line x1="700" y1="540" x2="700" y2="620" stroke="#fb923c" stroke-width="1.5" marker-end="url(#aro)"/>
<text x="710" y="585" fill="#fb923c" font-size="8">Postgres kuyruğu → NATS (Faz 2)</text>
