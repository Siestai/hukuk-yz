[project]
name = "hukuk-ingest"
version = "0.1.0"
description = "Content-based file type detection and text extraction for the hukuk-agent corpus"
requires-python = ">=3.12"
dependencies = ["pypdfium2>=4.30", "python-docx>=1.1"]

[project.scripts]
hukuk-ingest = "hukuk_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hukuk_ingest"]
