# Amending acts (değiştiren kanunlar) used by the statute timeline (task 11a).
#
# One [[act]] per (law, kabul_tarihi); public data, sourced from the Resmî Gazete / mevzuat.gov.tr.
#   law          "6552", or "KHK-665" for decree-laws, or "AYM" for Constitutional Court annulments
#                (kabul_tarihi is then the decision date)
#   kabul_tarihi date the act was adopted; matches the date in the inline annotation
#   rg_tarihi, rg_sayisi   Resmî Gazete date and issue
#   yururluk     in-force date; leave it out when unknown (the timeline reports yururluk_unknown)
#   source_url   required whenever yururluk is set; no invented dates
#   note         optional
#   alias_of     kabul date of another entry of the same law that this one repeats (a typo of a date in
#                the annotations); it carries nothing else and takes everything from that entry.
#                Otherwise kabul_tarihi after rg_tarihi is an error.
# [[act.exception]]: an article whose in-force date differs from the act's
#   statute, article (normalised: "18", "Ek 2", "Geçici 4"), scope (free text), yururluk,
#   source ("dipnot" or a URL)
#   partial      true when only the part named in scope (fıkra, bent, cümle, ibare) enters into force
#                on yururluk and the rest follows the act's date: the timeline reports a gap
#                (partial_entry_into_force) between the two dates. Needs scope and yururluk.
#   yururluk     leave it out when the date is vague ("ödeme dönemi başında"): the article then has an
#                unknown in-force date (yururluk_unknown), never the act's date.
# The statutes themselves (4857, 5510) are acts too: their entry gives the original in-force date.
#
# Source of most rows: the official "yürürlüğe giriş tarihlerini gösterir liste/tablo" printed at the end of
# the consolidated 4857 and 5510 texts (mevzuat.gov.tr); RG numbers and AYM rows cross-checked against
# the Resmî Gazete. Dates marked "hesaplanmış" in a note are computed from a deferred annulment.

