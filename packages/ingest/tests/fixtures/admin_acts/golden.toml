# Golden sections of the genelges in scope (handoff 2026-11-22, A3): the section count and the
# text of three sections each, copied line by line from the text layer of the files in
# `data/drive/Mevzuat/Genelge/` (official SGK text). `validity`: the start of the wording on file,
# read from the amendment notes in the file.

[[act]]
ref = "2020/8"
date = "2020-04-01"
sections = 177

[[act.section]]
no = "11.3"
text = '''
11.3- Bilgi ve belgelerin Sosyal Güvenlik Merkezi bulunmayan yere gönderilmesi ve
bahse konu bilgi ve belgenin yasal süre içerisinde Kurum kayıtlarına intikal etmiş olması
halinde idari para cezası uygulanmayacaktır.'''

[[act.section]]
no = "11.6"
text = '''
11.6- İdarî para cezası uygulanması 5510 sayılı Kanunun 8 inci, 9 uncu, 11 inci ve 86
ncı maddelerde belirtilen belgelerin Kuruma verilmesi yükümlülüğünü ortadan kaldırmaz.'''

[[act.section]]
no = "11.16"
text = '''
11.16- Bu genelgenin yayımlandığı tarih itibariyle tebliğ edilmemiş, tebliğ edilmiş
olmakla birlikte tahsil olunmamış idari para cezaları hakkında bu genelgedeki lehe olan
hükümler uygulanır ancak tahsil edilmiş olan tutarlar iade veya mahsup edilmez.'''

