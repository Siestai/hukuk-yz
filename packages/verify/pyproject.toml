[project]
name = "hukuk-verify"
version = "0.1.0"
description = "Official-source lookup and E/K matching for court decisions (no database)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hukuk_verify"]
