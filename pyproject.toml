[project]
name = "hukuk-agent"
version = "0.1.0"
description = "Turkish labour and social security law research assistant (monorepo root)"
requires-python = ">=3.12"
dependencies = ["hukuk-app", "hukuk-ingest", "hukuk-models", "hukuk-verify"]

[tool.uv]
package = false

[tool.uv.sources]
hukuk-app = { workspace = true }
hukuk-ingest = { workspace = true }
hukuk-models = { workspace = true }
hukuk-verify = { workspace = true }

[tool.uv.workspace]
members = ["services/app", "packages/*"]
exclude = ["packages/ui", "packages/web-core"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services/app/tests", "eval/tests", "packages/models/tests", "packages/ingest/tests", "packages/verify/tests"]
