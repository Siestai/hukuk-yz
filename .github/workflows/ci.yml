name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hukuk
          POSTGRES_PASSWORD: hukuk
          POSTGRES_DB: hukuk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hukuk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://hukuk:hukuk@localhost:5432/hukuk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make install
      - run: make lint typecheck test
