name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hukuk
          POSTGRES_PASSWORD: hukuk
          POSTGRES_DB: hukuk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hukuk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://hukuk:hukuk@localhost:5432/hukuk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Tesseract (OCR integration tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-tur
      - run: make install
      - run: make lint typecheck test
      - name: Migrate (upgrade, downgrade, upgrade)
        run: |
          uv run alembic -c services/app/alembic.ini upgrade head
          uv run alembic -c services/app/alembic.ini downgrade base
          uv run alembic -c services/app/alembic.ini upgrade head
      - name: Alembic check (models match migrations)
        run: uv run alembic -c services/app/alembic.ini check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/app/Dockerfile -t hukuk-app:ci .
      - name: Container runs as non-root
        run: |
          uid=$(docker run --rm hukuk-app:ci id -u)
          echo "uid=$uid"
          test "$uid" != "0"
      - name: Console scripts run (venv path matches shebangs)
        run: |
          docker run --rm hukuk-app:ci alembic --help > /dev/null
          docker run --rm hukuk-app:ci uvicorn --version
      - name: Image carries the checked-out source (no stale uv cache)
        run: |
          for pair in services/app/app:app packages/models/hukuk_models:hukuk_models \
              packages/ingest/hukuk_ingest:hukuk_ingest packages/verify/hukuk_verify:hukuk_verify; do
            src=${pair%%:*}; pkg=${pair##*:}
            want=$(cd "$src" && find . -name '*.py' -type f | LC_ALL=C sort | xargs sha256sum | sha256sum)
            got=$(docker run --rm --entrypoint sh hukuk-app:ci -c \
              "cd /app/.venv/lib/python3.12/site-packages/$pkg && find . -name '*.py' -type f | LC_ALL=C sort | xargs sha256sum | sha256sum")
            echo "$pkg $want / $got"
            test "$want" = "$got"
          done
      - name: Image is under 300MB
        run: |
          size=$(docker image inspect hukuk-app:ci --format '{{.Size}}')
          echo "size=$size bytes"
          test "$size" -lt 300000000
      - run: docker build -f services/dashboard-web/Dockerfile -t hukuk-dashboard-web:ci .
      - name: dashboard-web runs as non-root
        run: |
          uid=$(docker run --rm hukuk-dashboard-web:ci id -u)
          echo "uid=$uid"
          test "$uid" != "0"
      - name: dashboard-web image is under 400MB
        run: |
          size=$(docker image inspect hukuk-dashboard-web:ci --format '{{.Size}}')
          echo "size=$size bytes"
          test "$size" -lt 400000000
      - name: dashboard-web starts and /healthz answers (no API needed)
        run: |
          docker run -d --name dashboard-web-ci -p 3000:3000 \
            -e APP_API_URL=http://app.invalid:8000 hukuk-dashboard-web:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz || true)
            if [ "$code" = "200" ]; then echo "healthz: $code"; exit 0; fi
            sleep 1
          done
          docker logs dashboard-web-ci
          exit 1
      - name: dashboard-web serves its static assets (standalone copy layout)
        run: |
          asset=$(curl -fsS http://localhost:3000/giris | grep -o '/_next/static/[^"]*\.css' | head -1)
          test -n "$asset"
          curl -fsS -o /dev/null "http://localhost:3000$asset"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: make install
      - name: OpenAPI schema and generated types are current
        run: |
          pnpm openapi
          test -z "$(git status --porcelain -- services/dashboard-web/openapi.json services/dashboard-web/src/lib/api)"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check
