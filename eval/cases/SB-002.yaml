id: SB-002
question: "4/c sigortalısının ölümü sonrası hak sahiplerinin ölüm toptan ödemesi alabilmesi için gelir tespiti şartı var mıdır"
# Soru 4/1-(c) halini açıkça vermektedir. İlk sigortalılık tarihi sorulur: 5510 m.36/1 yalnız bu
# Kanuna göre ilk defa 4/1-(c) kapsamına girenleri kapsamaktadır.
facts:
  sigortalilik_hali: 4c
  talep_turu: olum_toptan_odemesi
expected:
  topic: olum_yaslilik_aylik
  status: conditional
  headline_contains:
    - toptan ödeme
    - baba
    - gelir
  must_cite:
    # Görev 19 B6 tur 1 (F1): madde düzeyine indirildi (5510 m.36/1 -> m.36, m.34/1-d -> m.34).
    # KB'deki 5510 m.36 ve m.34 metninde "(1)" biçiminde fıkra numarası yoktur; ajan fıkra ve
    # bendi künyede taşıyamaz (SB-001 notu). Fıkra ve bent ayrımı traps'ta kalır.
    - 5510 m.36
    - 5510 m.34
    - 2018/38 m.K4-B6-1.2
    - 2018/38 m.K2-B4-2.2.3
  must_ask:
    - ilk_sigortalilik_tarihi
  must_not:
    - gelir tespiti şartı aranmamaktadır
    - gelir şartı aranmamaktadır
    - toptan ödemede hak sahipliği şartı aranmaz
  traps:
    - Ölüm toptan ödemesi 5510 m.36'da düzenlenir; m.37 evlenme ve cenaze ödeneğidir, toptan ödemeye dayanak gösterilmez.
    - m.36/1 hak sahiplerini "34 üncü madde hükümleri dikkate alınarak" belirler; 2018/38 K4-B6-1.2 ölüm aylığında aranan şartları taşımayan hiçbir hak sahibine toptan ödeme yapılmayacağını açıkça yazar. Cevap kanunla birlikte genelge katmanından kurulur.
    - Asgari ücretin net tutarından az gelir şartı ve Kurum denetim memurlarınca gelir tespiti ana ve babaya özgüdür (5510 m.34/1-d, 2018/38 K2-B4-2.2.3, K2-B4-2.2.4); eş ve çocuklar için aynı şart yazılmaz, onların kendi şartları (çalışmama, kendi sigortalılığından gelir veya aylık bağlanmamış olma, yaş, öğrenim, malullük) ayrıca belirtilir.
    - Ana ve babada artan hisse şartı da vardır; 65 yaşın üstünde artan hisse aranmaz (5510 m.34/1-d).
    - 4/1-(c) sigortalısında m.36 yalnız bu Kanuna göre ilk defa 4/1-(c) kapsamında sigortalı olanlara uygulanır; 2008/Ekim öncesi kamu görevlisi için KB'de okunabilir hüküm yoktur (5510 Geçici m.4 düşük güven bandındadır), bu grup için kesin cümle kurulmaz.
    - Toptan ödeme ancak ölüm aylığı bağlanamadığında söz konusudur (m.32/2 gün ve süre şartları); bu ön şart cevapta belirtilir.
  missing_in_kb:
    # 5434 sayılı Kanun ve 5510 Geçici m.4: 2008/Ekim öncesi 4/1-(c) (Emekli Sandığı iştirakçisi) için
    # geçiş hükmü. 5510 Geçici m.4 çıkarımı var ancak güven bandı low (K1 gereği okunamaz).
    - 5510 m.Geçici 4
    - "5434"
    # Notlarda "ilgili AYM kararları" anılmaktadır; yerel KB'nin decision tablosu boştur ve
    # teyitli karar yoktur. Künye yazılmamıştır.
    - AYM kararı (ana-baba gelir şartı, belirlenmedi)
tags: [sgk, olum-sigortasi, toptan-odeme, hak-sahibi]
