id: SB-014
# Daraltma: asıl soru karar karşılaştırması ve itiraz yazısı da istemektedir; eval yalnız bir yıllık
# sürenin başlangıcını ölçer. Yazı üretimi kapsam dışıdır.
question: "İşverene uygulanan işe giriş bildirgesi cezasında bir yıl içinde tekrar halinde ceza 5 kat uygulanıyor. Bahsedilen bir yılın ne zaman başlayacağına ilişkin mevzuat nedir?"
expected:
  topic: idari_para_cezasi
  status: definite
  headline_contains:
    - tespit tarih
  must_cite:
    # Okundu: KB chunk ref "5510 m.102" (2018-05-25'ten itibaren geçerli sürüm), birinci fıkra (a) bendi (3) alt bendi.
    - 5510 m.102/1-a-3
    # Okundu: KB chunk ref "2020/8 m.2.1.1", (ç) bendi, alt bent (3) açıklaması ve Örnek 4.
    - 2020/8 m.2.1.1
  # Soru kuralın kendisini sormaktadır, olaya ait olgu istemez; şablondaki onceki_tespit_tarihi
  # olgusu somut bir hesapta sorulur, burada sorulması beklenmez.
  must_ask: []
  must_not:
    - tebliğ tarihinden itibaren bir yıl
  traps:
    - Bir yıl, işyeri esas alınarak önceki fiilin anlaşıldığı tarihten başlar; bu tarih mahkeme karar tarihi, Kurum denetim memurunun tespit tarihi, diğer kamu kurumu denetim elemanının rapor tarihi veya kamu idaresi, banka ya da kanunla kurulan kuruluştan alınan bilgi ve belgenin Kuruma intikal tarihidir (5510 m.102/1-a-3).
    - Beş kat ceza için yeni fiilin de bir yıl içinde m.102/1-a-2'de sayılan yollardan biriyle (mahkeme kararı, denetim tespiti, kamu idaresi belgesi) anlaşılması gerekir; ilk ceza iki kat, tekrar beş kattır.
    - Süre, cezanın tebliğ tarihinden, takvim yılından veya sigortalının işe başlama tarihinden sayılmaz.
    - 2020/8 m.2.1.1 Örnek 4'te yeni rapor, önceki denetim tespitinden bir yıldan fazla sonra geldiği için ceza yeniden iki kat olarak uygulanmaktadır; süre en son tespitten itibaren izlenir.
    - Bir yıl içinde birden fazla tespit hâlinde her bir işe giriş bildirgesi için beş kat ceza uygulanır (2020/8 m.2.1.1).
    - Kanunda hüküm bulunması aramayı bitirmez; 2020/8 Genelgesinin işe giriş bildirgesi bölümü taranmadan cevap verilmez.
  missing_in_kb:
    # decision tablosu yerel KB'de boştur; bir yıllık sürenin başlangıcına ilişkin teyitli Danıştay
    # veya bölge idare mahkemesi kararı bulunamadı. Künye yazılmadı.
    - Danıştay / BİM kararı (5510 m.102/1-a-3 bir yıllık sürenin başlangıcı)
tags: [sgk, idari-para-cezasi, ise-giris-bildirgesi, tekrar]
