    - İşyeri bildirgesi süresi ile işe giriş bildirgesi süresi ayrıdır.
    - İnşaat, balıkçılık ve tarım işyerlerinde m.8 birinci fıkra (a) bendi aynı gün der; yeni açılan inşaat işyerinde (b) bendinin uygulanıp uygulanmadığı kaynaklarda çözülmemiştir.
    # Eklendi: kanun ile yönetmelik ve genelge başlangıç tarihini farklı sözcüklerle anmaktadır.
    - Kanun bir aylık süreyi "ilk defa sigortalı çalıştırmaya başlanılan tarihten itibaren", SSİY m.11/3-b ve 2013/11 K1-B4-2.4 ise "işyerinin tescil tarihinden itibaren" diye yazar; genelge örneğinde tescil tarihi ilk sigortalının çalışmaya başladığı tarihtir. İki tarih farklıysa hangisinin esas alınacağı kaynakla gösterilmeden kesin söylenmez.
