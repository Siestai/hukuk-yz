    - Ay sonu kuralının dayanağı HMK m.92/2'dir; TBK m.92/3 sözleşme süreleri içindir, dayanak gösterilmez.
    # Değişti: HMK m.93/1 metni yalnız "resmî tatil" demektedir; Cumartesi ve Pazar örnekleri 2013/11 Genelgesindedir. Dayanak ayrı yazıldı.
