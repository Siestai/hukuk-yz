  headline_contains:
    - toplu iş sözleşmesi
  must_cite:
    - 6356 m.36/1
    - 6356 m.36/2
    - 6356 m.39/1
    - 7036 m.3/1
    - 4857 m.24/II-e
    - 9. HD E.2008/26536 K.2008/25713
  # Görev 19 B1 gözden geçirme (şablon: tis_sendikal). 6356 m.36 (high), m.39 (medium),
  # 7036 m.3 (medium), 4857 m.24 (high) KB'de okundu. 9. HD kararı dergi arşivinde (sayı 20)
  # bulunmaktadır, ancak KB decision tablosunda kaydı ve karararama E/K teyidi yoktur.
  missing_in_kb:
