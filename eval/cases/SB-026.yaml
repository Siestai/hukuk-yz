  bildirim_durumu: hic_bildirim
expected:
  status: definite
  headline_contains:
    - geriye dönük hizmet
    - verilmektedir
  must_cite:
    - 5510 m.86/9
    - 5510 m.86/8
    - 10. HD E.2026/513 K.2026/4936
    - SSİY m.18/1-c
