  traps:
    - m.86/8 (denetimde en fazla bir yıl) ile m.86/9 (ilam, beş yıl) karıştırılmaz; fıkra sayımına mülga altıncı fıkra dahildir.
    - Bir yıllık sınır yoktur ancak her hizmet yılı için beş yıllık dava süresi vardır; "dönem sınırı yok" tek başına yanıltıcıdır.
    - Beş yılın hak düşürücü olması m.86/9 metninde değil Yargıtay 10. HD gerekçesindedir; SGK yazısı "zamanaşımı" der. Kaynak belirtilir.
    - İşe iade kararı hizmet tespiti kararı değildir; yalnız en çok dört aylık süre prime ve hizmete dahil edilir.
    - Genelge künyesi İkinci Kısım İkinci Bölüm 1.3'tür; Birinci Bölüm yazmak yanlıştır.
    - Kanun hükmü okunmadan "uygulanmıyor" veya "açık nokta" gibi dayanaksız kanaat cümlesi kurulmaz.
