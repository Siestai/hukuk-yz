  traps:
    - Kanuni grev (askı, fesih yasağı) ile kanun dışı grev (haklı fesih, tazminat, idari ceza) ayrımı cevabın merkezindedir.
    - Askıdaki işçiye grev süresince ücret ve sosyal yardım ödenemez, süre kıdem tazminatına sayılmaz; bunun aksi TİS ile kararlaştırılamaz (m.67/3).
    - Kanuni grevde fesih yasağı yalnız katılma veya teşvik nedeniyle fesihtir (m.66/2).
    - Lokavt, grev kararının tebliğinden sonra ve usulüne uygun bildirimle alınmalıdır; aksi hâlde kanun dışıdır.
    - 2822 dönemine ait Yargıtay kararları 6356 maddeleriyle karşılaştırılmadan kullanılmaz.
