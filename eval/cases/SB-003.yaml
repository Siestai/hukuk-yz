  traps:
    - Yazılı bildirim ve altı işgünü içinde yazılı kabul birlikte aranır; yalnız bildirim yetmez.
    - Bordro imzası veya sessiz devam kabul değildir; imzalı yeni iş sözleşmesi (ücret miktarı yazılı) kabul sayılır.
