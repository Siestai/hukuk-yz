  headline_contains:
    - yazılı
  must_cite:
    - 4857 m.22/1
    - 4857 m.22/2
    - 9. HD E.2021/4643 K.2021/8989
    - 9. HD E.2016/9412 K.2019/16512
    - 9. HD E.2012/6260 K.2014/11165
  must_ask:
