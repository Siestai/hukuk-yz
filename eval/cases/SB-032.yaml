id: SB-032
# Daraltma: özgün soru önceki bir hesabın senaryolarına atıf yapmaktaydı; soru tek başına
# anlaşılır hâle getirildi (B-cases-new10.md). Hesap tutarı beklenmez (md.29).
question: "Giydirilmiş ücrete yemek, yol ve kupon (yemek kartı) yardımı eklenir mi, neden eklenir? Dayanağı ve yerleşik içtihatla birlikte açıkla."
# Görev 19 B1. Şablon: kidem_ihbar (olgu yardim_niteligi).
# must_cite madde düzeyindedir: dayanak 1475 m.14'ün on birinci fıkrasıdır ("ücrete ilaveten
# işçiye sağlanmış olan para ve para ile ölçülmesi mümkün akdi ve kanundan doğan menfaatler"),
# ancak KB metninde fıkra numarası yoktur ve ajan fıkrayı künyede taşıyamaz (SB-001 notu).
# "Yerleşik içtihat" için arşivde aday kararlar vardır (yemek ve yol yardımı, giydirilmiş ücret);
# decision tablosunda yok ve E/K teyitsiz olduklarından künye yazılmadı.
expected:
  status: conditional
  headline_contains:
    - giydirilmiş
  must_cite:
    - 1475 m.14
    - 4857 m.17
  must_ask:
    - yardim_niteligi
  must_not:
    - izin ücretine de eklenir
    - ihbar tazminatında çıplak ücret esas alınır
  traps:
    - Kıdem tazminatına esas ücrete, 1475 m.14 uyarınca ücrete ilaveten sağlanan para ve para ile ölçülebilen sözleşme ve kanundan doğan menfaatler girer; ihbar tazminatı için aynı ölçü 4857 m.17 son fıkradadır.
    - Yıllık izin ücretinde 4857 m.57 m.50'ye yollama yapar ve m.50 sosyal yardımları hesaba katmaz; giydirilmiş ücret izin ücretine taşınmaz.
    - Yardımın ayni veya nakdi verilmesi ile sürekli ve düzenli ya da arızi olması ayrı sorulardır; süreklilik ölçütü Yargıtay içtihadına dayanır, doğrulanmış karar okunmadan kesin cümleyle verilmez.
    - SGK prime esas kazanç istisnaları (5510 m.80) ile kıdem tazminatına esas ücret (1475 m.14) ayrı hükümlerdir; birinin kapsamı ötekinden çıkarılmaz.
    - Yerleşik içtihat istendiğinde teyitsiz karar künyesi verilmez; KB'de doğrulanmış karar yoksa bu durum kaynak eksikliği olarak belirtilir.
tags: [is-hukuku, kidem-tazminati, giydirilmis-ucret]
missing_in_kb:
  - "Yargıtay 9. HD / HGK: düzenli ödenen yemek, yol ve yemek kartı yardımının giydirilmiş ücrete katılması, arızi ödeme ayrımı (arşivde aday kararlar var, decision tablosunda yok, E/K teyitsiz)"
