# Teyit bekleyen Yargıtay kararları (aday listesi)
#
# Kural (md. 25; docs/decisions.md 2026-11-22 "teyitsiz künyeler aday listesinde"): Karararama'da
# (karararama.yargitay.gov.tr) esas / karar numarasıyla teyit edilmemiş künye eval vaka dosyasına
# (eval/cases/*.yaml) girmez. Vaka analizinde bulunan böyle künyeler burada bekler.
#
# Akış:
# - teyit edildi ve KB decision tablosuna yüklendi -> vakaya geri döner (`use` alanındaki yere),
#   bu listeden silinir;
# - Karararama'da bulunamadı ya da E/K tutmadı -> listeden silinir, vaka dosyasına dönmez;
#   bulunan bilgi düzeltilmez, "bulunmaya" çalışılmaz.
#
# Alanlar:
#   chamber, esas, karar, date : dergi arşivindeki ayrıştırılmış künye (teyitsiz)
#   journal_issue, journal_title: Çalışma ve Toplum dergisi sayısı ve karar başlığı
#   karararama                  : unverified | verified | not_found
#   cases                       : hangi vaka, nerede kullanılacaktı (must_cite / must_not / traps)
#   note                        : vakadaki kullanım bağlamı

decisions:
