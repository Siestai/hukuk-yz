<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glarus · Liman</title>
<!--
TASARIM PLANI — Yön D "Liman" (A'nın güveni + B'nin sıcaklığı)
1. Palet: lacivert mürekkep #14233F (metin, yapı, kenar çubuğu), kâğıt #F6F1E6 / yüzey #FCFAF4 / çukur #EDE6D4, çizgi #DDD3BC,
   turkuaz #0E7C73 (ana etkileşim; beyaz üstünde 5:1+, koyu "dudak" #0A5A53, yumuşak #DDEFEA), sıcak aksan mat altın #B38A2E / metin #6F5113 / yumuşak #F3E7C6
   (yalnız alıntı vurgusu, "koşullu" rozeti, onaysız etiketi; ekranın %5'inden az). Büyük sarı alan yok.
2. Yazı: Newsreader (wordmark, soru, cevap başlığı, madde metni, dayanak sayfası) + Figtree (arayüz; yuvarlak ama hassas). Ölçek: 13/15/17/18/20/24/36.
3. Yerleşim: masaüstünde lacivert konuşma listesi | kâğıt üstünde tek okuma sütunu (44rem) | sağa yaslı Dayanak sütunu. Telefonda kâğıt üst bar + çekmece + alt sayfa.
4. Yüzey dili: kartlar tek ince çizgili (16px), içinde kutu yok; bölümler ince çizgiyle ayrılır. Yuvarlaklık (10px) yalnız etkileşimli öğelerde.
5. Dokunsal: butonlar, seçenekler, atıf çipleri 2px "dudak" gölgeli; basınca 2px çöker. Soru kartı "Soru 2 / 5" + ince ilerleme çubuğu, büyük seçenekler,
   cevaplanan soru tek satıra (tik + etiket + değer) çöker.
6. Radius: 10 (kontrol) ve 16 (kart). Boşluk: 4/8/12/16/24/32/48. Tüm değerler :root'ta, bileşende sabit renk yok.
7. UNUTULMAZ OLAN: dayanak sayfası. Alıntı, madde metninin içinde altın fosforla işaretli, serif okuma metni olarak sağ sütunda durur; cevap solda, kaynak yanında.
8. Wordmark: "Glarus" Newsreader + altında küçük "by siestai"; işaret: lacivert yuvarlak kare içinde serif G ve turkuaz nokta (cümle sonu noktası = netlik).
9. Boş durum işareti: ince halka + turkuaz nokta + altın ufuk çizgisi (liman girişi); karakter yok. Çalışırken halka döner.
10. Veri: flows.js içeriği dosyaya gömülü, olduğu gibi. Dayanak metni yalnız veride olan alıntıdır.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
<style>
:root{
  /* color */
  --navy:#14233F; --navy-2:#1F3358; --navy-3:#0D1829;
  --paper:#F6F1E6; --surface:#FCFAF4; --sunk:#EDE6D4;
  --line:#DDD3BC; --line-2:#C2B697;
  --ink:#14233F; --ink-2:#44506A; --ink-inv:#F6F1E6; --ink-inv-2:#AAB4C8;
  --teal:#0E7C73; --teal-lip:#0A5A53; --teal-soft:#DDEFEA; --teal-edge:#9CCDC5; --teal-ink:#0A5A53; --teal-bright:#35B5A8; --on-teal:#FFFFFF;
  --gold:#B38A2E; --gold-soft:#F3E7C6; --gold-ink:#6F5113; --mark:rgba(179,138,46,.34);
  --danger:#8E3B2F; --danger-soft:#F6E1DC;
  --scrim:rgba(20,35,63,.5); --shadow-c:rgba(20,35,63,.16);
  --focus:#0E7C73; --focus-dark:#E6C46F;
  /* type */
  --font-serif:'Newsreader',Georgia,'Times New Roman',serif;
  --font-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs-xs:.8125rem; --fs-sm:.9375rem; --fs-md:1.0625rem; --fs-read:1.125rem; --fs-lg:1.25rem; --fs-xl:1.5rem; --fs-2xl:2.25rem;
  --fs-head:1.25rem;
  /* radius: controls / cards */
  --r-ctl:10px; --r-card:16px;
  /* space */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  /* tactile + shadow */
  --lip:2px; --sh-pop:0 -12px 40px -8px var(--shadow-c);
  --tap:48px; --hair:1px;
  --sidebar-w:272px; --viewer-w:440px; --read-w:44rem;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-ui);font-size:var(--fs-md);line-height:1.6;color:var(--ink);background:var(--paper);-webkit-text-size-adjust:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:var(--r-ctl)}
.dark :focus-visible{outline-color:var(--focus-dark)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--font-serif);margin:0;line-height:1.25;font-weight:500}

/* ---------- tactile button ---------- */
.btn{--bg:var(--surface);--lipc:var(--line-2);--fg:var(--ink);--bd:var(--line-2);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:var(--tap);padding:var(--s2) var(--s5);border:var(--hair) solid var(--bd);border-radius:var(--r-ctl);
  background:var(--bg);color:var(--fg);font-weight:600;font-size:var(--fs-md);line-height:1.25;
  box-shadow:0 var(--lip) 0 var(--lipc);transform:translateY(0);transition:transform .08s,box-shadow .08s,background .15s;text-align:center}
.btn:hover{background:color-mix(in srgb,var(--bg) 94%,var(--ink))}
.btn:active:not(:disabled){transform:translateY(var(--lip));box-shadow:0 0 0 var(--lipc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.teal{--bg:var(--teal);--lipc:var(--teal-lip);--bd:var(--teal-lip);--fg:var(--on-teal)}
.btn.teal:hover{background:var(--teal-lip)}
.btn.navy{--bg:var(--navy-2);--lipc:var(--navy-3);--bd:var(--navy-3);--fg:var(--ink-inv)}
.btn.sm{min-height:44px;padding:var(--s2) var(--s4);font-size:var(--fs-sm)}
.btn[aria-pressed=true]{--bg:var(--teal-soft);--lipc:var(--teal-edge);--bd:var(--teal);color:var(--teal-ink)}
.linkbtn{background:none;border:0;padding:var(--s3) var(--s2);min-height:44px;color:var(--ink-2);font-weight:500;text-decoration:underline;text-underline-offset:3px;border-radius:var(--r-ctl)}
.linkbtn:hover{color:var(--ink)}

/* ---------- app shell ---------- */
.app{height:100dvh;display:grid;grid-template-columns:1fr;position:relative;background:var(--paper)}
.sidebar{position:fixed;inset:0 auto 0 0;width:min(88vw,320px);z-index:40;background:var(--navy);color:var(--ink-inv);display:flex;flex-direction:column;padding:var(--s4);padding-top:max(var(--s4),env(safe-area-inset-top));transform:translateX(-102%);transition:transform .25s ease;overflow-y:auto;visibility:hidden}
.sidebar.open{transform:none;visibility:visible}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.brand{display:flex;align-items:center;gap:var(--s3)}
.brand .mark{flex:none}
.brand .mark .bg{fill:var(--navy)} .brand .mark .g{fill:var(--ink-inv)} .brand .mark .dot{fill:var(--teal-bright)}
.dark .brand .mark .bg{fill:var(--ink-inv)} .dark .brand .mark .g{fill:var(--navy)}
.brand .word{display:flex;flex-direction:column;line-height:1}
.brand .name{font-family:var(--font-serif);font-weight:600;font-size:1.625rem;letter-spacing:-.015em;color:var(--ink)}
.brand .by{font-size:var(--fs-xs);font-weight:500;color:var(--ink-2);margin-top:2px;letter-spacing:.02em}
.dark .brand .name{color:var(--ink-inv)} .dark .brand .by{color:var(--ink-inv-2)}
.sidebar .newbtn{margin:var(--s5) 0 var(--s4);width:100%}
.sidebar h2{font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--ink-inv-2);font-weight:600;margin:var(--s3) var(--s2) var(--s2);letter-spacing:.02em}
.convlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s1);flex:1}
.conv{width:100%;text-align:left;min-height:var(--tap);padding:var(--s3) var(--s3);border-radius:var(--r-ctl);border:var(--hair) solid transparent;background:transparent;color:var(--ink-inv);font-weight:600;font-size:var(--fs-sm);line-height:1.35;display:block}
.conv small{display:block;font-weight:400;color:var(--ink-inv-2);font-size:var(--fs-xs)}
.conv[aria-current=true]{background:var(--navy-2);border-color:var(--navy-2)}
.conv:hover{background:var(--navy-2)}
.convempty{color:var(--ink-inv-2);font-size:var(--fs-sm);padding:var(--s3) var(--s2)}
.logout{margin-top:var(--s4);background:none;border:var(--hair) solid var(--navy-2);color:var(--ink-inv);border-radius:var(--r-ctl);min-height:var(--tap);font-weight:600;width:100%}
.logout:hover{background:var(--navy-2)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100dvh;background:var(--paper)}
.topbar{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4);padding-top:max(var(--s2),env(safe-area-inset-top));flex:none;border-bottom:var(--hair) solid var(--line)}
.topbar .brand{flex:1;min-width:0}
.topbar .brand .name{font-size:1.5rem}
.iconbtn{width:var(--tap);height:var(--tap);padding:0;display:grid;place-items:center;flex:none;min-height:var(--tap)}
.iconbtn .bars{width:20px;height:14px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;position:relative;border-radius:2px}
.iconbtn .bars::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:currentColor;border-radius:2px}
.sheetwrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.thread{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;padding:var(--s5) var(--s4) var(--s6);-webkit-overflow-scrolling:touch}
.col{max-width:var(--read-w);margin:0 auto;display:flex;flex-direction:column;gap:var(--s4)}

/* empty */
.empty{text-align:center;padding:var(--s5) 0 var(--s2);display:flex;flex-direction:column;align-items:center;gap:var(--s4)}
.empty h1{font-size:var(--fs-xl);font-weight:500;letter-spacing:-.01em}
.empty p{margin:0;color:var(--ink-2);font-size:var(--fs-sm);max-width:36ch}
.chips{display:flex;flex-direction:column;gap:var(--s3);width:100%;max-width:560px;margin-top:var(--s2)}
.sugg{width:100%;text-align:left;justify-content:flex-start;padding:var(--s3) var(--s4);min-height:var(--tap);font-weight:400;font-size:var(--fs-sm);line-height:1.5;display:block}
.sugg b{display:block;font-size:var(--fs-xs);color:var(--teal-ink);font-weight:700;margin-bottom:2px;letter-spacing:.01em}
.sugg span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hmark{width:56px;height:56px;overflow:visible}
.hmark .ring{fill:none;stroke:var(--navy);stroke-width:1.5}
.hmark .dot{fill:var(--teal)}
.chead .hmark{width:32px;height:32px}
.hmark .hor{stroke:var(--gold);stroke-width:1.5;stroke-linecap:round}
.hmark .orbit{transform-origin:28px 28px}
.hmark .dotg{animation:breathe 4s ease-in-out infinite;transform-origin:28px 12px}
.hmark.busy .orbit{animation:spin 2.4s linear infinite}
.hmark.busy .dotg{animation:none}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* bubbles */
.msg{display:flex;animation:rise .35s ease both}
.msg.user{justify-content:flex-end}
.bubble{max-width:88%;background:var(--navy);color:var(--ink-inv);padding:var(--s3) var(--s4);border-radius:var(--r-card);overflow-wrap:anywhere;font-size:var(--fs-md)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* cards */
.card{background:var(--surface);border:var(--hair) solid var(--line);border-radius:var(--r-card);padding:var(--s4);animation:rise .4s ease both;min-width:0}
.card>h2,.card>.chead{margin-bottom:var(--s3)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.chead h2{font-size:var(--fs-lg)}
.tag{display:inline-block;color:var(--teal-ink);background:var(--teal-soft);font-weight:600;font-size:var(--fs-xs);padding:2px var(--s3);border-radius:var(--r-ctl)}

/* progress steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
.steps li{display:flex;align-items:center;gap:var(--s3);color:var(--ink-2);min-height:32px;font-size:var(--fs-sm)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;transition:background .2s,border-color .2s}
.steps li.done{color:var(--ink)}
.steps li.done .dot{background:var(--teal);border-color:var(--teal)}
.steps li.done .dot::after{content:"";width:5px;height:9px;border:solid var(--on-teal);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.steps li.now{color:var(--ink)}
.steps li.now .dot{border-color:var(--teal);animation:pulse 1.2s ease-in-out infinite}
.steps li.now span{background:linear-gradient(90deg,var(--ink-2) 0%,var(--ink) 40%,var(--ink-2) 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes pulse{50%{transform:scale(1.15)}}

/* facts */
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.fact{display:grid;grid-template-columns:1fr auto;gap:var(--s1) var(--s3);align-items:center;padding:var(--s3) 0;border-top:var(--hair) solid var(--line)}
.fact:first-child{border-top:0;padding-top:0}
.fact .k{font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);grid-column:1/2}
.fact .v{grid-column:1/2;font-family:var(--font-serif);font-size:var(--fs-read);line-height:1.4;overflow-wrap:anywhere}
.fact .v.unk{color:var(--ink-2);font-style:italic}
.fact .v.pop{animation:pop .5s ease}
.fact .btn{grid-column:2/3;grid-row:1/3}
.fact input{width:100%;min-height:var(--tap);border:var(--hair) solid var(--line-2);border-radius:var(--r-ctl);padding:0 var(--s3);font-size:1rem;background:var(--paper)}
.fact .editrow{grid-column:1/3;display:flex;gap:var(--s2);flex-wrap:wrap}
.fact .editrow input{flex:1;min-width:140px}
@keyframes pop{0%{background:var(--gold-soft)}100%{background:transparent}}

/* question card */
.qcard{background:var(--surface);border:var(--hair) solid var(--line);border-radius:var(--r-card);padding:var(--s5) var(--s4);animation:rise .4s ease both;display:flex;flex-direction:column;gap:var(--s4)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.qhead b{font-weight:600;font-size:var(--fs-sm);white-space:nowrap;color:var(--teal-ink)}
.pbar{flex:1;max-width:160px;height:6px;border-radius:var(--r-ctl);background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--teal);border-radius:var(--r-ctl);transition:width .4s ease}
.qlabel{font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);margin-bottom:var(--s1)}
.qtext{font-family:var(--font-serif);font-size:var(--fs-xl);font-weight:500;line-height:1.28;letter-spacing:-.005em}
.why{border-top:var(--hair) solid var(--line);font-size:var(--fs-sm);color:var(--ink-2);line-height:1.6}
.why summary{min-height:var(--tap);display:flex;align-items:center;gap:var(--s2);cursor:pointer;list-style:none;font-weight:600;color:var(--ink)}
.why summary::-webkit-details-marker{display:none}
.why summary::after{content:"";margin-left:var(--s1);width:8px;height:8px;border:solid var(--ink-2);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s;margin-top:-3px}
.why[open] summary::after{transform:rotate(-135deg);margin-top:3px}
.why p{margin:0}
.basis{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.opts{display:flex;flex-direction:column;gap:var(--s3)}
.opt{width:100%;text-align:left;justify-content:flex-start;font-weight:500;padding:var(--s3) var(--s4);min-height:56px;font-size:var(--fs-md)}
.opt .letter{flex:none;width:28px;height:28px;border-radius:var(--r-ctl);background:var(--paper);border:var(--hair) solid var(--line-2);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700;color:var(--ink-2)}
.opt.chosen{--bg:var(--teal-soft);--lipc:var(--teal-edge);--bd:var(--teal);animation:pop .45s ease}
.opt.chosen .letter{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.opt.idk{--bg:transparent;--lipc:transparent;border-style:dashed;color:var(--ink-2);box-shadow:none}
.opt.idk:active:not(:disabled){transform:none}
.qcard.done{pointer-events:none}
.qsum{display:flex;align-items:baseline;gap:var(--s3);min-height:var(--tap);padding:var(--s3) var(--s2);border-bottom:var(--hair) solid var(--line);animation:rise .3s ease both;min-width:0;align-items:center}
.qsum .k{font-size:var(--fs-sm);color:var(--ink-2);flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.qsum .v{font-family:var(--font-serif);font-size:var(--fs-read);flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.qsum svg{width:20px;height:20px;flex:none;align-self:center}
.datebox{display:flex;flex-direction:column;gap:var(--s2)}
.datebox input,.textbox textarea{width:100%;min-height:var(--tap);border:var(--hair) solid var(--line-2);border-radius:var(--r-ctl);padding:var(--s3) var(--s4);font-size:1rem;background:var(--paper);box-shadow:inset 0 2px 0 var(--sunk)}
.datebox input:focus,.textbox textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.textbox textarea{min-height:96px;resize:vertical}
.hint{font-size:var(--fs-xs);color:var(--ink-2)}
.skip{align-self:flex-start;margin:calc(var(--s2) * -1) 0 0}

/* answer: a typeset document */
.answer{background:var(--surface);border:var(--hair) solid var(--line);border-radius:var(--r-card);padding:var(--s5) var(--s4);animation:rise .5s ease both;display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:var(--s2);font-weight:700;padding:var(--s1) var(--s3);min-height:32px;border-radius:var(--r-ctl);font-size:var(--fs-sm);line-height:1}
.badge.clear{background:var(--teal-soft);color:var(--teal-ink)}
.badge.cond{background:var(--gold-soft);color:var(--gold-ink)}
.badge svg{width:18px;height:18px;flex:none}
.note{font-size:var(--fs-xs);color:var(--ink-2);margin:calc(var(--s2) * -1) 0 0;line-height:1.55}
.headline{font-family:var(--font-serif);font-weight:500;font-size:var(--fs-head);line-height:1.42;margin:0;overflow-wrap:anywhere;letter-spacing:-.005em;text-wrap:pretty}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s1);padding:var(--s1);background:var(--sunk);border-radius:var(--r-card)}
.modes button{border:var(--hair) solid transparent;background:transparent;min-height:44px;border-radius:var(--r-ctl);font-weight:600;font-size:var(--fs-sm);color:var(--ink-2);padding:0 var(--s1)}
.modes button[aria-checked=true]{background:var(--surface);color:var(--ink);border-color:var(--line-2);box-shadow:0 var(--lip) 0 var(--line-2)}
.points{list-style:none;margin:0;padding:0;counter-reset:p}
.points>li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:var(--s3);counter-increment:p;animation:rise .35s ease both;padding:var(--s4) 0;border-top:var(--hair) solid var(--line)}
.points>li::before{content:counter(p);font-family:var(--font-serif);font-size:var(--fs-lg);line-height:1.5;color:var(--teal-ink);font-weight:500}
.points p{margin:0 0 var(--s3);overflow-wrap:anywhere;font-family:var(--font-serif);font-size:var(--fs-read);line-height:1.62}
.cites{display:flex;flex-wrap:wrap;gap:var(--s2)}

  var s=svg('<g class="orbit"><circle class="ring" cx="28" cy="28" r="20"/></g><line class="hor" x1="14" y1="40" x2="42" y2="40"/><g class="dotg"><circle class="dot" cx="28" cy="12" r="4"/></g>','hmark');
  s.setAttribute('viewBox','0 0 56 56');s.setAttribute('aria-hidden','true');return s;
}
function tickSvg(){var s=svg('<circle cx="10" cy="10" r="9" fill="var(--teal)"/><path d="M5.5 10.5l3 3 6-6.5" fill="none" stroke="var(--on-teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>');s.setAttribute('viewBox','0 0 20 20');return s}

/* ---------- state ---------- */
var convs=[], cur=null, drawerOpen=false;
var thread=$('#thread'), composer=$('#composer'), qEl=$('#q');

function scrollDown(el){
  requestAnimationFrame(function(){ if(el&&el.scrollIntoView) el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}); });
}
function scrollEnd(){requestAnimationFrame(function(){thread.scrollTo({top:thread.scrollHeight,behavior:reduce?'auto':'smooth'})})}

/* ---------- drawer ---------- */
function setDrawer(o){drawerOpen=o;$('#sidebar').classList.toggle('open',o);$('#scrim').classList.toggle('show',o);$('#menuBtn').setAttribute('aria-expanded',o);if(o)$('#newBtn').focus()}
$('#menuBtn').onclick=function(){setDrawer(!drawerOpen)};
$('#scrim').onclick=function(){setDrawer(false)};
$('#logout').onclick=function(){toast('Önizlemede oturum kapatılmaz.')};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('#viewer').classList.contains('open')||$('#app').classList.contains('viewing'))closeViewer();else if(drawerOpen){setDrawer(false);$('#menuBtn').focus()}}});

/* ---------- conversations ---------- */
function renderList(){
  var ul=$('#convList');ul.textContent='';
  if(!convs.length){ul.appendChild(h('li',{class:'convempty',text:'Henüz konuşma yok.'}));return}
  convs.slice().reverse().forEach(function(c){
    var b=h('button',{class:'conv',type:'button','aria-current':c===cur?'true':'false',onclick:function(){show(c);setDrawer(false)}},
      c.flow.topic,h('small',null,c.status));
    ul.appendChild(h('li',null,b));
  });
}
function newConv(){
  closeViewer();
  cur=null;thread.textContent='';thread.appendChild(emptyView());composer.hidden=false;qEl.placeholder='Sorunuzu yazın';
  renderList();setDrawer(false);thread.scrollTop=0;
}
function show(c){
  closeViewer();cur=c;thread.textContent='';thread.appendChild(c.col);
  composer.hidden=!c.finished;qEl.placeholder='Yeni bir soru yazın';
  renderList();thread.scrollTop=thread.scrollHeight;
}
$('#newBtn').onclick=newConv;

function emptyView(){
  var comp=compassSvg();
  var chips=h('div',{class:'chips',role:'group','aria-label':'Örnek sorular'});
  FLOWS.forEach(function(f){
    chips.appendChild(h('button',{class:'btn sugg',type:'button',onclick:function(){start(f)}},h('b',null,f.topic),h('span',null,f.question)));
  });
  return h('div',{class:'col'},h('div',{class:'empty'},comp,h('h1',null,'Ne öğrenmek istiyorsunuz?'),
    h('p',null,'İş Kanunu ve SGK mevzuatı için sorunuzu yazın ya da bir örnekle başlayın.'),chips));
}

/* ---------- flow ---------- */
function matchFlow(t){
  t=t.toLowerCase();
  if(/devams|gelmedi|mazeret/.test(t))return FLOWS[0];
  if(/saat|vardiya|çalışma koşul/.test(t))return FLOWS[1];
  if(/ölüm|toptan|4\/c|kıdem/.test(t))return FLOWS[2];
  return null;
}
composer.addEventListener('submit',function(e){
  e.preventDefault();var t=qEl.value.trim();if(!t)return;
  var f=matchFlow(t);
  if(!f){toast('Bu önizlemede yalnız 3 örnek akış çalışır.');return}
  qEl.value='';autoGrow();start(f,t);
});
function autoGrow(){qEl.style.height='auto';qEl.style.height=Math.min(qEl.scrollHeight,180)+'px'}
qEl.addEventListener('input',autoGrow);
qEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();composer.requestSubmit()}});

function start(flow,text){
  closeViewer();
  var col=h('div',{class:'col'});
  var c={flow:flow,col:col,status:'Sürüyor',finished:false,answers:{},};
  convs.push(c);cur=c;thread.textContent='';thread.appendChild(col);composer.hidden=true;
  renderList();setDrawer(false);
  run(c,text||flow.question);
}
function artRef(r){return String(r).replace(/(m\.[^\/\s]+)\/.*$/,'$1')}
function allCites(f){
  var out=[];
  f.answer.points.forEach(function(p){p.citations.forEach(function(x){out.push(x)})});
  (f.answer.missing_info||[]).forEach(function(p){(p.citations||[]).forEach(function(x){out.push(x)})});
  return out;
}
/* soru dayanağı (ör. "4857 m.22/1") -> madde düzeyi alıntılar; yoksa sorunun gerekçesi */
function basisCite(f,ref,why){
  var art=artRef(ref),qs=[],first=null;
  allCites(f).forEach(function(x){
    if(artRef(x.ref)===art&&x.quote){if(!first)first=x;if(qs.indexOf(x.quote)<0)qs.push(x.quote)}
  });
  var lab=first?first.label:ref;
  if(first)return {ref:ref,label:lab,quotes:qs,valid_from:first.valid_from,unreviewed:first.unreviewed,category:first.category};
  return {ref:ref,label:ref,why:why};
}
function add(c,el){c.col.appendChild(el);if(cur===c)scrollDown(el);return el}

async function run(c,text){
  var f=c.flow;
  add(c,h('div',{class:'msg user'},h('div',{class:'bubble',text:text})));
  /* progress */
  var labels=['Konu belirleniyor...','Kaynaklar okunuyor...','Cevap hazırlanıyor...'];
  var lis=labels.map(function(l){return h('li',null,h('i',{class:'dot'}),h('span',{text:l}))});
  var comp=compassSvg();comp.classList.add('busy');comp.setAttribute('width','32');comp.setAttribute('height','32');
  var prog=h('div',{class:'card','aria-live':'polite'},h('div',{class:'chead'},h('h2',{style:'margin:0',text:'Üzerinde çalışıyorum'}),comp),h('ul',{class:'steps',style:'margin-top:12px'},lis));
  add(c,prog);
  for(var i=0;i<lis.length;i++){
    lis[i].className='now';await sleep(950);lis[i].className='done';
  }
  await sleep(250);prog.remove();
  /* facts */
  var rows={};
  var ul=h('ul',{class:'facts'});
  f.known.forEach(function(k){ul.appendChild(factRow(k.label,k.value,null,rows))});
  f.questions.forEach(function(q){ul.appendChild(factRow(q.label,null,q.key,rows))});
  c.rows=rows;
  add(c,h('section',{class:'card','aria-label':'Anladığım olay'},h('div',{class:'chead'},h('h2',{style:'margin:0',text:'Anladığım olay'}),h('span',{class:'tag',text:f.topic})),ul));
  await sleep(500);
  ask(c,0);
}
function factRow(label,value,key,rows){
  var li=h('li',{class:'fact'});
  var v=h('div',{class:'v'+(value?'':' unk'),text:value||'Bilinmiyor'});
  var k=h('div',{class:'k',text:label});
  var btn=h('button',{class:'btn sm',type:'button','aria-label':label+' bilgisini düzenle',text:'Düzenle'});
  li.appendChild(k);li.appendChild(v);li.appendChild(btn);
  function set(val){
    v.textContent=val||'Bilinmiyor';v.className='v'+(val?'':' unk')+(val?' pop':'');
  }
  btn.onclick=function(){
    var inp=h('input',{type:'text',value:value||'','aria-label':label,placeholder:'Değeri yazın'});
    var save=h('button',{class:'btn teal sm',type:'button',text:'Kaydet'});
    var cancel=h('button',{class:'btn sm',type:'button',text:'Vazgeç'});
    var row=h('div',{class:'editrow'},inp,save,cancel);
    k.style.display=v.style.display=btn.style.display='none';li.appendChild(row);inp.focus();
    function close(){row.remove();k.style.display=v.style.display=btn.style.display='';btn.focus()}
    save.onclick=function(){value=inp.value.trim()||null;set(value);close()};
    cancel.onclick=close;
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();save.click()}if(e.key==='Escape'){e.stopPropagation();cancel.click()}});
  };
  if(key)rows[key]={set:function(val){value=val;set(val)}};
  return li;
}

function summary(label,val){
  return h('div',{class:'qsum'},tickSvg(),h('span',{class:'k',text:label}),h('span',{class:'v',text:val,title:val}));
}
function ask(c,i){
  var f=c.flow,qs=f.questions;
  if(i>=qs.length){return finish(c)}
  var q=qs[i];
  var dots=h('div',{class:'pbar',role:'img','aria-label':'Soru '+(i+1)+' / '+qs.length},h('i',{style:'width:'+Math.round((i+1)/qs.length*100)+'%'}));
  var card=h('section',{class:'qcard','aria-label':'Soru '+(i+1)+' / '+qs.length});
  var body=h('div',{class:'opts'});
  var bases=h('div',{class:'basis'});
  q.basis.forEach(function(r){bases.appendChild(citeChip(c,basisCite(f,r,q.why)))});
  var why=h('details',{class:'why'},h('summary',null,'Neden soruyorum?'),h('p',null,q.why),bases);
  card.appendChild(h('div',{class:'qhead'},h('b',{text:'Soru '+(i+1)+' / '+qs.length}),dots));
  card.appendChild(h('div',null,h('div',{class:'qlabel',text:q.label}),h('div',{class:'qtext',text:q.text})));
  card.appendChild(why);
  var locked=false;
  function answer(display,store,btn){
    if(locked)return;locked=true;
    if(btn)btn.classList.add('chosen');
    card.classList.add('done');
    c.answers[q.key]=display;
    if(c.rows&&c.rows[q.key])c.rows[q.key].set(display);
    setTimeout(function(){
      card.replaceWith(summary(q.label,display));
      setTimeout(function(){ask(c,i+1)},reduce?0:250);
    },reduce?0:450);
  }
  function idk(){return h('button',{class:'btn opt idk',type:'button',onclick:function(e){answer('Bilmiyorum',null,e.currentTarget)}},'Bilmiyorum')}
  var letters='ABCDEFGH';
  if(q.kind==='choice'){
    q.options.forEach(function(o,j){body.appendChild(h('button',{class:'btn opt',type:'button',onclick:function(e){answer(o,o,e.currentTarget)}},h('span',{class:'letter',text:letters[j]}),o))});
    body.appendChild(idk());
  }else if(q.kind==='date'){
    var inp=h('input',{type:'date',id:'d'+i,'aria-describedby':'dh'+i,max:'2100-12-31'});
    var go=h('button',{class:'btn teal',type:'button',disabled:true,text:'Devam'});
    inp.addEventListener('input',function(){go.disabled=!inp.value});
    go.onclick=function(){if(inp.value)answer(fmtDate(inp.value),inp.value,go)};
    body.appendChild(h('div',{class:'datebox'},h('label',{class:'sr',for:'d'+i},q.label),inp,h('span',{class:'hint',id:'dh'+i,text:'Biçim: GG.AA.YYYY'})));
    body.appendChild(go);
    q.options.forEach(function(o){body.appendChild(h('button',{class:'btn opt',type:'button',onclick:function(e){answer(o,o,e.currentTarget)}},o))});
    body.appendChild(idk());
  }else{
    var ta=h('textarea',{id:'t'+i,placeholder:'Kısaca yazın','aria-label':q.label});
    var go2=h('button',{class:'btn teal',type:'button',disabled:true,text:'Devam'});
    ta.addEventListener('input',function(){go2.disabled=!ta.value.trim()});
    go2.onclick=function(){if(ta.value.trim())answer(ta.value.trim(),ta.value,go2)};
    body.appendChild(h('div',{class:'textbox'},ta));body.appendChild(go2);body.appendChild(idk());
  }
  card.appendChild(body);
  card.appendChild(h('button',{class:'linkbtn skip',type:'button',onclick:function(){if(locked)return;locked=true;card.replaceWith(summary(q.label,'Atlandı'));finish(c)},text:'Soruları atla, koşullu cevabı göster'}));
  add(c,card);
}

/* ---------- answer ---------- */
async function finish(c){
  var f=c.flow;
  var comp=compassSvg();comp.classList.add('busy');comp.setAttribute('width','32');comp.setAttribute('height','32');
  var li=h('li',{class:'now'},h('i',{class:'dot'}),h('span',{text:'Cevap hazırlanıyor...'}));
  var p=h('div',{class:'card'},h('div',{class:'chead'},h('h2',{style:'margin:0',text:'Üzerinde çalışıyorum'}),comp),h('ul',{class:'steps',style:'margin-top:12px'},li));
  add(c,p);await sleep(1100);p.remove();
  var ans=answerCard(c);c.col.appendChild(ans);
  if(cur===c)requestAnimationFrame(function(){thread.style.scrollBehavior='auto';thread.scrollTop=ans.offsetTop-12;thread.style.scrollBehavior=''});
  c.finished=true;c.status=f.answer.status==='conditional'?'Koşullu cevap':'Net cevap';
  renderList();
  if(cur===c){composer.hidden=false;qEl.placeholder='Yeni bir soru yazın'}
}
function citeChip(c,cit,onOpen){
  var missing=false;
  var b=h('button',{class:'cite'+(missing?' nodata':''),type:'button','aria-label':'Dayanak: '+cit.label+(cit.unreviewed?' (onaysız, test)':''),onclick:function(){openViewer(c,cit,b)}},cit.label);
  if(cit.unreviewed)b.appendChild(h('small',{text:'onaysız (test)'}));
  return b;
}
function answerCard(c){
  var f=c.flow,a=f.answer,mode='short';
  var cond=a.status==='conditional';
  var badge=h('div',{class:'badge '+(cond?'cond':'clear')});
  if(!cond)badge.appendChild(tickSvg());
  badge.appendChild(document.createTextNode(cond?'Koşullu cevap':'Net cevap'));
  var el=h('section',{class:'answer'+(cond?'':' ok'),'aria-label':'Cevap'});
  el.appendChild(badge);
  if(a.status_note)el.appendChild(h('p',{class:'note',text:a.status_note}));
  el.appendChild(h('div',{class:'hl'},h('p',{class:'headline',text:a.headline})));
  var modes=[['short','Kısa'],['long','Ayrıntılı'],['proof','Gerekçeli']];
  var sw=h('div',{class:'modes',role:'radiogroup','aria-label':'Gösterim biçimi'});
  var list=h('ol',{class:'points',style:'margin:0;padding:0;list-style:none'});
  list.style.cssText='';list.className='points';
  var moreP=h('p',{class:'more'});
  function renderPoints(){
    list.textContent='';
    var n=mode==='short'?a.short_point_count:a.points.length;
    a.points.slice(0,n).forEach(function(pt){
      var cs=h('div',{class:'cites'});pt.citations.forEach(function(ct){cs.appendChild(citeChip(c,ct))});
      var li=h('li',null,h('div',null,h('p',{text:pt.text}),cs));
      if(mode==='proof')pt.citations.forEach(function(ct){li.lastChild.appendChild(h('blockquote',{class:'quote'},h('b',null,ct.label),'“'+ct.quote+'”'))});
      list.appendChild(li);
    });
    var rest=a.points.length-n;
    moreP.textContent=rest>0?'Kısa görünümde '+rest+' madde daha gizli. Tümü için “Ayrıntılı” seçin.':'';
    moreP.style.display=rest>0?'':'none';
  }
  var btns=modes.map(function(m){
    var b=h('button',{type:'button',role:'radio','aria-checked':String(m[0]===mode),text:m[1],onclick:function(){mode=m[0];btns.forEach(function(x,j){x.setAttribute('aria-checked',modes[j][0]===mode)});renderPoints()}});
    sw.appendChild(b);return b;
  });
  /* arrow keys for radiogroup */
  sw.addEventListener('keydown',function(e){
    var idx=modes.findIndex(function(m){return m[0]===mode}),d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;
    if(d){e.preventDefault();idx=(idx+d+3)%3;btns[idx].click();btns[idx].focus()}
  });
  el.appendChild(sw);el.appendChild(list);el.appendChild(moreP);renderPoints();
  if(a.missing_info&&a.missing_info.length){
    var s=h('div',{class:'sect'},h('h3',null,'Tamamlanması gereken bilgiler'));
    a.missing_info.forEach(function(m){
      var cs=h('div',{class:'cites'});(m.citations||[]).forEach(function(ct){cs.appendChild(citeChip(c,ct))});
      s.appendChild(h('div',{class:'cond-row'},h('p',{class:'if'},h('b',null,'Koşul'),m.condition),h('p',{class:'then'},h('b',null,'Sonuç'),m.result),cs));
    });
    el.appendChild(s);
  }
  var rd=f.sources_read||[];
  var ul=h('ul');rd.forEach(function(r){ul.appendChild(h('li',{text:r}))});
  el.appendChild(h('details',{class:'reads'},h('summary',null,'Okunanlar ('+rd.length+')'),ul));
  /* feedback */
  var up=h('button',{class:'btn sm',type:'button','aria-pressed':'false',text:'Faydalı'});
  var down=h('button',{class:'btn sm',type:'button','aria-pressed':'false',text:'Hatalı'});
  up.onclick=function(){up.setAttribute('aria-pressed','true');down.setAttribute('aria-pressed','false');toast('Teşekkürler.')};
  down.onclick=function(){down.setAttribute('aria-pressed','true');up.setAttribute('aria-pressed','false');toast('Geri bildiriminiz alındı.')};
  var rep=h('button',{class:'btn sm',type:'button','aria-expanded':'false',text:'Hata bildir'});
  var box=null;
  rep.onclick=function(){
    if(box){box.remove();box=null;rep.setAttribute('aria-expanded','false');return}
    var ta=h('textarea',{'aria-label':'Hata açıklaması',placeholder:'Neyin hatalı olduğunu kısaca yazın'});
    var send=h('button',{class:'btn teal sm',type:'button',text:'Gönder',onclick:function(){box.remove();box=null;rep.setAttribute('aria-expanded','false');toast('Hata bildiriminiz alındı (test).')}});
    box=h('div',{class:'reportbox'},ta,h('div',null,send));
    fb.after(box);rep.setAttribute('aria-expanded','true');ta.focus();
  };
  var cp=h('button',{class:'btn sm',type:'button',text:'Kopyala'});
  cp.onclick=function(){
    var txt=a.headline+'\n\n'+a.points.map(function(p,i){return (i+1)+'. '+p.text+' ['+p.citations.map(function(x){return x.label}).join('; ')+']'}).join('\n');
    var done=function(){cp.textContent='Kopyalandı';setTimeout(function(){cp.textContent='Kopyala'},1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,function(){toast('Kopyalanamadı.')});else toast('Kopyalanamadı.');
  };
  var fb=h('div',{class:'fb',role:'group','aria-label':'Geri bildirim'},up,down,rep,cp);
  el.appendChild(fb);
  return el;
}

/* ---------- viewer ---------- */
var lastTrigger=null;
function openViewer(c,cit,trigger){
  lastTrigger=trigger;
  document.querySelectorAll('.cite.on').forEach(function(x){x.classList.remove('on')});
  if(trigger)trigger.classList.add('on');
  $('#vTitle').textContent=cit.label;
  var body=$('#vBody');body.textContent='';
  var st=h('div',{class:'vstat'});
  if(cit.unreviewed)st.appendChild(h('span',{class:'pill warn',text:'Onaysız metin (test)'}));
  if(cit.valid_from)st.appendChild(h('span',{class:'pill',text:'Yürürlük: '+fmtDate(cit.valid_from)+' tarihinden beri'}));
  if(cit.category==='admin_act')st.appendChild(h('span',{class:'pill',text:'İdari düzenleme'}));
  if(st.children.length)body.appendChild(st);
  if(cit.why){
    body.appendChild(h('div',{class:'article'},h('span',{class:'ctx',text:'Bu dayanak, sorunun gerekçesinde anılmaktadır: '}),cit.why));
  }else{
    (cit.quotes||[cit.quote]).forEach(function(qt){
      body.appendChild(h('div',{class:'article'},h('span',{class:'ctx',text:'(madde metninin devamı) '}),h('mark',{text:qt}),h('span',{class:'ctx',text:' (madde metninin devamı)'})));
    });
    body.appendChild(h('p',{class:'hint',text:'İşaretli bölüm cevapta dayanak alınan metindir.'}));
  }
  $('#viewer').classList.add('open');$('#app').classList.add('viewing');
  if(!wide())$('#vScrim').classList.add('show');
  $('#vScrim').classList.toggle('show',!wide());
  $('#vClose').focus({preventScroll:true});
  $('#vBody').scrollTop=0;
}
function closeViewer(){
  var was=$('#viewer').classList.contains('open');
  $('#viewer').classList.remove('open');$('#app').classList.remove('viewing');$('#vScrim').classList.remove('show');
  document.querySelectorAll('.cite.on').forEach(function(x){x.classList.remove('on')});
  if(was&&lastTrigger&&document.body.contains(lastTrigger))lastTrigger.focus({preventScroll:true});
  lastTrigger=null;
}
$('#vClose').onclick=closeViewer;
$('#vScrim').onclick=closeViewer;
window.matchMedia('(min-width:1100px)').addEventListener('change',function(){$('#vScrim').classList.remove('show');if(!wide()&&$('#viewer').classList.contains('open'))$('#vScrim').classList.add('show')});

setupBrand();
newConv();
})();

</script>
