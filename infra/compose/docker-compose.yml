# Run from the repo root via `make up` (passes --env-file .env). Publishes no host ports: local
# ports live in docker-compose.local.yml; in production Traefik reaches dashboard-web over the network.
x-app: &app
  build:
    context: ../..
    dockerfile: services/app/Dockerfile
  # Both optional. Local: the repo-root .env (`make up`). Dokploy writes its Environment tab to a
  # .env next to this file, i.e. infra/compose/.env (docs/deploy.md); both are gitignored.
  env_file:
    - path: ../../.env
      required: false
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Decision PDFs (GET /review/decisions/{id}/file): the Drive copy, mounted read-only below.
      ARCHIVE_ROOT: /archive
    volumes:
      - ${ARCHIVE_HOST_DIR:-../../data/drive}:/archive:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 10s
      timeout: 5s
      retries: 5

  # Browser entry point: the only service that is exposed in production (docs/deploy.md). No
  # database credentials: it talks to `app` over HTTP only.
  dashboard-web:
    build:
      context: ../..
      dockerfile: services/dashboard-web/Dockerfile
    environment:
      APP_API_URL: http://app:8000
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]

volumes:
  pgdata:
