[project]
name = "hukuk-agent-service"
version = "0.1.0"
description = "hukuk-agent LangGraph agent (task 17)"
requires-python = ">=3.12"
dependencies = [
    "hukuk-models",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic-ai-slim[anthropic,openai]>=1.0",
    "pyyaml>=6.0.3",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "genai-prices>=0.1.13",
]

[tool.uv.sources]
hukuk-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
