# Genel şablon: şablonu olmayan konular için (docs/tasks/17-agent-v1.md).
id: genel
title: Genel
description: İş hukuku, sosyal güvenlik, sendika ve toplu iş sözleşmesi ve iş sağlığı ve güvenliği konularında, başka bir şablona uymayan sorular.
facts:
