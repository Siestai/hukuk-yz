# Konu kartları SB-027 (izin süresi hesabı), SB-028 (izin ücreti ve haklı fesih).
id: yillik_izin
title: Yıllık ücretli izin
description: >-
  Yıllık ücretli izin süresi (4857 m.53), izin kullanma, izin ücreti (m.57, m.59) ve izin
  ücretinin ödenmemesi hâlinde işçinin haklı feshi.
facts:
  - key: ise_giris_tarihi
    label: İşe giriş tarihi
    critical: true
    question:
      text: İşçi işe hangi tarihte başladı?
      why: İzin süresi, işçinin hizmet süresine göre belirlenmektedir (4857 m.53).
      kind: date
      basis:
        - {ref: "4857 m.53", category: statute}
  - key: yas_durumu
    label: Yaş
    critical: true
    question:
      text: İşçi on sekiz yaş ve altında veya elli yaş ve üzerinde mi?
      why: İşçinin yaşı, izin süresini etkileyebilmektedir (4857 m.53).
      kind: choice
      options:
        - {value: evet, label: Evet}
        - {value: hayir, label: Hayır, assumed_never: true}
      basis:
        - {ref: "4857 m.53", category: statute}
  - key: yer_alti
    label: Yer altı işi
    critical: true
    question:
      text: İşçi yer altı işlerinde mi çalışmaktadır?
      why: İşin niteliği, izin süresini etkileyebilmektedir (4857 m.53).
      kind: choice
      options:
        - {value: evet, label: Evet}
        - {value: hayir, label: Hayır, assumed_never: true}
      basis:
        - {ref: "4857 m.53", category: statute}
  - key: sozlesme_izin
    label: Sözleşmede daha uzun izin
    critical: true
    question:
      text: İş sözleşmesi veya toplu iş sözleşmesi daha uzun izin öngörmekte midir?
      why: Sözleşmede öngörülen izin süresi, kanundaki süreyi etkileyebilmektedir (4857 m.53).
      kind: choice
      options:
        - {value: evet, label: Evet}
        - {value: hayir, label: Hayır, assumed_never: true}
      basis:
        - {ref: "4857 m.53", category: statute}
  - key: kullanilan_izin
    label: Kullanılan izin
  - key: izin_ucreti_odemesi
    label: İzin ücretinin ödenmesi
must_read:
  - {ref: "4857 m.53", category: statute}
  - {ref: "4857 m.54", category: statute}
  - {ref: "4857 m.57", category: statute}
  - {ref: "4857 m.59", category: statute}
  - {ref: "22. HD E.2017/26700 K.2020/105", category: decision}
  - {ref: "9. HD E.2022/6747 K.2022/8363", category: decision}
  - {ref: "9. HD E.2025/2024 K.2025/2487", category: decision}
queries:
  - yıllık ücretli izin süresi hizmet süresi
  - yıllık izin ücreti ödenmesi haklı fesih
traps:
  - İzin süresi ve izin ücretine ilişkin süreler ve eşikler okunan kaynak metinden alınır; metinde yazmayan bir süre veya tutar cevaba yazılmaz.
  - İzin gününün ve izin ücretinin tutarı hesap motorunda hesaplanır; cevapta tutar bulunmaz.
calculations:
  - title: Yıllık izin ücreti
    needs:
      - Hak edilen izin günü
      - Kullanılan izin günü
      - Çıplak günlük ücret
