queries:
  - kanuni grev kanuni lokavt iş sözleşmelerinin askıya alınması
  - kanun dışı grev haklı nedenle fesih tazminat sorumluluğu
  - grev ve lokavtın kanun dışı olup olmadığının tespiti mahkeme
traps:
  - Kanuni grev (askı, fesih yasağı) ile kanun dışı grev (haklı fesih, tazminat, idari para cezası) ayrımı cevabın merkezindedir (6356 m.67, m.66/2, m.70, m.78/1).
  - Askıdaki işçiye grev ve lokavt süresince ücret ve sosyal yardım ödenemez, bu süre kıdem tazminatı hesabında dikkate alınmaz; aksi TİS ile kararlaştırılamaz (6356 m.67/3).
  - Fesih yasağı kanuni grev kararına katılma, teşvik ve greve katılma nedeniyle fesih içindir (6356 m.66/2); başka nedenle fesih bu fıkranın kapsamında değildir.
  - Lokavt kararı grev kararının tebliğinden itibaren altmış gün içinde alınabilir ve altı iş günü önceden bildirilecek tarihte uygulanır (6356 m.60/2).
  - 2822 dönemine ait Yargıtay kararları 6356 maddeleriyle karşılaştırılmadan kullanılmaz.
