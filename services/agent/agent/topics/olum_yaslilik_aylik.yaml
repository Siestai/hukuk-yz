# Konu kartları SB-002 (4/1-c sigortalısının ölümünde ölüm toptan ödemesi ve ana-baba gelir şartı) ve
# SB-042 (yaş dışındaki şartlarla ayrılmada kıdem tazminatına esas yazı, 2008 öncesi/sonrası girişler).
# Ad: görev 19 B2 listesindeki "olum_yaslilik_aylik" korunmuştur; kapsam 5510 ölüm ve yaşlılık
# sigortası (m.28-38) ile kıdem tazminatına esas yazıdır (2018/38 K2-B3-7).
# Okunamayan kaynaklar (K1, güven bandı low): 5510 m.28, Geçici m.4, Geçici m.7, Geçici m.9.
# Bu nedenle must_read ve basis listesinde yer almazlar; 28. maddenin içeriği 2018/38 K2-B3-2.1.3'ten okunur.
id: olum_yaslilik_aylik
title: Ölüm ve yaşlılık sigortası (aylık, toptan ödeme, kıdem yazısı)
description: >-
  5510 sayılı Kanuna göre ölüm aylığı ve ölüm toptan ödemesi (m.32, m.34, m.36), hak sahiplerinin
  şartları (ana-baba gelir tespiti), yaşlılık aylığı şartlarının ilk sigortalılık tarihine göre
  belirlenmesi (2018/38 K2-B3-2.1, 5510 Geçici m.6) ve emeklilik için yaş dışındaki şartları
  tamamlayarak ayrılan işçinin kıdem tazminatına esas yazısı (1475 m.14/1-5, 2018/38 K2-B3-7).
facts:
  - key: sigortalilik_hali
    label: Sigortalılık hali
    critical: true
    asked_when: {talep_turu: [unknown, olum_ayligi, olum_toptan_odemesi, yaslilik_ayligi]}
    question:
      text: Sigortalı 5510 m.4/1'in hangi bendine göre sigortalıdır (en son tabi olunan hal)?
      why: >-
        Ölüm toptan ödemesi 4/1-(a) ve 4/1-(b) sigortalıları ile bu Kanuna göre ilk defa
        4/1-(c) kapsamında sigortalı olanların hak sahiplerine yapılmaktadır (5510 m.36/1).
        1/5/2008'den itibaren ilk defa sigortalı olanlarda yaşlılık aylığı için prim gün şartı
        4/1-(a) sigortalılarında 7200, 4/1-(b) ve 4/1-(c) sigortalılarında 9000 gündür
        (2018/38 m.K2-B3-2.1.3).
      kind: choice
      options:
        - {value: 4a, label: "Hizmet akdiyle çalışan (4/1-a)"}
        - {value: 4b, label: "Kendi adına ve hesabına çalışan (4/1-b)"}
        - {value: 4c, label: "Kamu idaresinde çalışan (4/1-c)"}
      basis:
        - {ref: "5510 m.36/1", category: statute}
        - {ref: "2018/38 m.K2-B3-2.1.3", category: admin_act}
  - key: ilk_sigortalilik_tarihi
    label: İlk sigortalılık tarihi
    critical: true
    question:
      text: >-
        Sigortalı herhangi bir sosyal güvenlik kanununa göre ilk kez hangi tarihte sigortalı oldu?
        (Son işyerine giriş tarihi değil, ilk tescil tarihi.)
      why: >-
        Sigortalılık süresinin başlangıcı, sigortalının 506, 5434, 1479 sayılı kanunlar gibi
        mülga ya da yürürlükteki kanunlara veya 5510'a göre ilk defa kapsama girdiği tarihtir
        (5510 m.38/1). Yaşlılık aylığı şartları 8/9/1999 öncesi, 8/9/1999 ile 30/4/2008 arası
        ve 30/4/2008 sonrası sigortalı olanlar için ayrı belirlenmektedir (2018/38 m.K2-B3-2.1).
        4/1-(c) sigortalısının hak sahipleri ölüm toptan ödemesine ancak sigortalı bu Kanuna
        göre ilk defa 4/1-(c) kapsamına girmişse hak kazanır (5510 m.36/1).
      kind: date
      basis:
        - {ref: "5510 m.38/1", category: statute}
        - {ref: "2018/38 m.K2-B3-2.1", category: admin_act}
        - {ref: "5510 m.36/1", category: statute}
  - key: olay_tarihi
    label: Ölüm tarihi veya Kuruma başvuru tarihi
    question:
      text: Sigortalının ölüm tarihi ya da aylık / yazı için Kuruma başvuru tarihi nedir?
      why: >-
        2008/Ekim ay başından önce ölen 4/1-(a) ve 4/1-(b) sigortalılarının hak sahiplerine
        gelir veya aylık bağlanmasında, sigortalıya ilişkin koşullar ölüm tarihindeki Kanun
        hükümlerine göre belirlenmektedir (2018/38 m.K2-B4-2.1).
      kind: date
      basis:
        - {ref: "2018/38 m.K2-B4-2.1", category: admin_act}
  - key: talep_turu
    label: İstenen hak
    question:
      text: Hangi hak talep edilmektedir?
      why: >-
        Ölüm sigortası ölüm aylığı, ölüm toptan ödemesi, evlenme ödeneği ve cenaze ödeneği
        haklarını sağlamaktadır (5510 m.32/1). Yaşlar dışındaki şartları tamamlayarak kendi
        isteğiyle ayrılan işçinin kıdem tazminatı için Kurum kıdem tazminatına esas yazı
        vermektedir (2018/38 m.K2-B3-7).
      kind: choice
      options:
        - {value: olum_ayligi, label: Ölüm aylığı}
        - {value: olum_toptan_odemesi, label: Ölüm toptan ödemesi}
        - {value: yaslilik_ayligi, label: Yaşlılık aylığı}
        - {value: kidem_yazisi, label: Kıdem tazminatına esas yazı (yaş dışındaki şartlar)}
      basis:
        - {ref: "5510 m.32/1", category: statute}
        - {ref: "2018/38 m.K2-B3-7", category: admin_act}
  - key: hak_sahibi
    label: Hak sahibi
    question:
      text: Ölüm halinde hakkı isteyen kimdir?
      why: >-
        Eş, çocuk ve ana-baba için aranan şartlar ayrıdır (5510 m.34/1). Ana ve babada eş ve
        çocuklardan artan hisse (65 yaş üstünde aranmaz), gelir veya aylık bağlanmamış olması
        ve her türlü kazanç ve irattan elde ettiği gelirin asgari ücretin net tutarından az
        olması aranmakta; bu gelir Kurum denetim memurlarınca tespit edilmektedir
        (2018/38 m.K2-B4-2.2.3).
      kind: choice
      options:
        - {value: es, label: Eş}
        - {value: cocuk, label: Çocuk}
        - {value: ana_baba, label: Ana veya baba}
      basis:
        - {ref: "5510 m.34/1", category: statute}
        - {ref: "2018/38 m.K2-B4-2.2.3", category: admin_act}
  - key: prim_gun_sayisi
    label: Prim ödeme gün sayısı ve sigortalılık süresi
    question:
      text: Sigortalının toplam prim ödeme gün sayısı ve sigortalılık süresi nedir?
      why: >-
        Ölüm aylığı en az 1800 gün ya da 4/1-(a) sigortalılarında borçlanmalar hariç en az 5 yıl
        sigortalılık ve 900 gün prim bildirilmesine bağlıdır (5510 m.32/2); aylık
        bağlanamamakta ise hak sahiplerine ölüm toptan ödemesi yapılmaktadır (5510 m.36/1).
      kind: text
      basis:
        - {ref: "5510 m.32/2", category: statute}
        - {ref: "5510 m.36/1", category: statute}
