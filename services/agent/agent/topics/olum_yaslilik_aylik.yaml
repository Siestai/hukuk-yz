queries:
  - ölüm toptan ödemesi hak sahiplerine 34 üncü madde hükümleri dikkate alınarak
  - ana ve baba her türlü kazanç ve irattan elde ettiği gelir asgari ücretin net tutarından az gelir tespiti
  - yaşlılık aylığı 30/4/2008 sonrasında sigortalı olanlar 7200 gün 5400 gün kademeli geçiş
  - kıdem tazminatına esas yazı yaş dışındaki sigortalılık süresi ve prim ödeme gün sayısı
traps:
  - Ölüm toptan ödemesi 5510 m.36'dadır; m.37 evlenme ve cenaze ödeneğini düzenler.
  - Ölüm toptan ödemesinde ölüm aylığında aranan hak sahipliği şartları aynen aranır; şartları taşımayan hak sahibine toptan ödeme yapılmaz (2018/38 K4-B6-1.2).
  - Asgari ücretin net tutarından az gelir şartı ve gelir tespiti ana ve babaya özgüdür (5510 m.34/1-d); eş ve çocuk için aynı şart yazılmaz.
  - 4/1-(c) sigortalısında m.36 yalnız bu Kanuna göre ilk defa 4/1-(c) kapsamına girenleri kapsar; daha önce sigortalı olan kamu görevlisi için hüküm KB'de okunabilir değildir, kesin cümle kurulmaz.
  - Yaşlılık şartları bakımından ayrım tarihi 30/4/2008'dir (2018/38 K2-B3-2.1.3); 5510'un 2008/Ekim yürürlük tarihi ile karıştırılmaz.
  - Belirleyici tarih son işyerine giriş değil, ilk sigortalılık başlangıcıdır (5510 m.38/1).
  - İşten ayrılış kodunun anlamı KB'deki kaynaklarda yer almaz; kod numarasından şart çıkarılmaz.
