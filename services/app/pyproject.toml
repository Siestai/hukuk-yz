[project]
name = "hukuk-app"
version = "0.1.0"
description = "hukuk-agent API and worker"
requires-python = ">=3.12"
dependencies = [
    "hukuk-models",
    "hukuk-ingest",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pgvector>=0.5.0",
]

[tool.uv.sources]
hukuk-ingest = { workspace = true }
hukuk-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
